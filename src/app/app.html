<app-navbar />
<main class="background">
  <div class="body">
    <div class="image-window">
      <img ngSrc="logo.png" width="200" height="200" class="image"/>
    </div>
    <div class="title-area">
      <h1 class="name">
        Lasse N. Poulsen
      </h1>
      <div class="link-row">
        <a class="git" href="https://github.com/Lasse-NP" target="_blank" rel="noopener noreferrer">
          <mat-icon [class.rotated]="gitRotated" 
            (mouseenter)="gitRotated = true" 
            (mouseleave)="gitRotated = false">
            commit
          </mat-icon>
        </a>
        <a class="lkin" href="https://www.linkedin.com/in/lasse-n-poulsen/" target="_blank" rel="noopener noreferrer">
          <mat-icon [class.rotated]="linkRotated" 
            (mouseenter)="linkRotated = true" 
            (mouseleave)="linkRotated = false">
            link
          </mat-icon>
        </a>
        <a class="mail" href="mailto:lasse@bjerg.dev">
          <mat-icon [class.lifted]="mailLifted" 
            (mouseenter)="onMailEnter()" 
            (mouseleave)="onMailLeave()">
            {{ mailIcon }}
          </mat-icon>
        </a>
      </div>
    </div>
  </div>
</main>
<router-outlet />
